# The TypeScript half of the wire contract is generated, never written.
#
# internal/protocol is the single definition of what travels on the socket; this turns it into
# types the browser can check itself against. Hand-writing the other half is what let live WPM
# and the result screen disagree in the first place.
packages:
  - path: "github.com/jordan-cod/typing-race/internal/protocol"
    output_path: "web/src/protocol/generated.ts"
    indent: "  "
    exclude_files:
      - "sumtypes.go"
      - "parse.go"
      - "build.go"
      - "parse_test.go"
    frontmatter: |
      // Code generated by tygo from internal/protocol. DO NOT EDIT.
      //
      // Run `make protocol` after changing the Go types.
