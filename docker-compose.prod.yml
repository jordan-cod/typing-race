# O que roda em producao, no droplet compartilhado.
#
# Este arquivo e a copia fiel do que esta em ~/typing-race no servidor. Ele vive aqui para o
# repositorio nao mentir sobre o que esta no ar: sem isso, a unica descricao do deploy estaria
# dentro da maquina que ela descreve.
#
# Um servico so. O binario Go serve o site e a API na mesma porta, entao o container do Caddy
# que servia o bundle deixou de existir — junto com a chance de site e API estarem em versoes
# diferentes.
#
# Sem banco: as salas vivem na memoria e somem quando o ultimo jogador sai.
services:
  app:
    image: ${APP_IMAGE}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # A imagem e `scratch` e o processo nao escreve nada em lugar nenhum.
    read_only: true
    restart: unless-stopped
    expose:
      - "3001"
    # O healthcheck vem do Dockerfile: o proprio binario se consulta, porque numa imagem sem
    # shell nao existe wget para chamar.
    networks:
      proxy:
        aliases:
          - typing

networks:
  proxy:
    external: true
