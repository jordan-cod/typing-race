name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal web)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...

      # -race is what catches a room being read while another goroutine writes it. The whole
      # server is goroutine-per-socket, so running the suite without it would test a program
      # nobody runs.
      - run: go test -race ./...

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
        working-directory: web

      # The wire contract is generated from the Go types. Regenerating it here and demanding no
      # diff is what stops the two halves from drifting: a change to internal/protocol that
      # never reached the browser fails the build instead of the player.
      - name: The generated contract is current
        run: |
          go tool tygo generate
          go test ./internal/race -run TestStatsGolden
          git diff --exit-code -- web/src/protocol/ \
            || { echo "run 'make protocol' and commit the result"; exit 1; }

      - run: bun run typecheck
        working-directory: web
      - run: bun run check
        working-directory: web
      - run: bun run test
        working-directory: web

  build:
    name: build
    needs: [go, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:${{ github.sha }}
            ${{ env.APP_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      # O token do job vive o tempo do job. Guardar um permanente no servidor seria uma
      # credencial parada esperando vazar.
      - name: Log the server in to GHCR
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and start
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            {
              echo "APP_IMAGE=${{ env.APP_IMAGE }}:${{ github.sha }}"
              echo "DEPLOYED_SHA=${{ github.sha }}"
            } > .env.image
            # --remove-orphans tira os containers `api` e `web` do deploy antigo, que este
            # compose nao descreve mais.
            docker compose --env-file .env.image up -d --remove-orphans --pull always
            docker image prune -f

      - name: Log the server out of GHCR
        if: always()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: docker logout ghcr.io

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            for attempt in $(seq 1 10); do
              docker exec proxy-caddy-1 wget -qO- http://typing:3001/health >/dev/null 2>&1 && { echo "up (attempt $attempt)"; exit 0; }
              echo "attempt $attempt: not ready"
              sleep 6
            done
            echo "did not answer /health after deploy"
            exit 1